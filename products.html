<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Verso</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body><a href="#app" class="sr-only focus:not-sr-only">Skip to content</a><header id="hd"></header><main id="app"><div class="max-w-[1500px] mx-auto px-5 md:px-10 py-10"><h1 class="serif text-5xl md:text-7xl mb-8">The Collection</h1><div class="flex gap-3 mb-5"><div class="relative flex-1"><label for="q" class="sr-only">Search products</label><span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg" aria-hidden="true">⌕</span><input id="q" type="search" autocomplete="off" placeholder="Search by name, category or brand" class="sbar w-full border border-black pl-12 pr-10 py-4 text-sm outline-none bg-white"><button id="qx" hidden class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8" aria-label="Clear search">✕</button></div><button id="fopen" class="btn flex items-center gap-3">Filters <span id="fn" class="bg-white text-black text-xs rounded-full w-5 h-5 grid place-items-center">0</span></button></div><div id="chips" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div><div id="tags" class="flex flex-wrap gap-2 mb-4"></div><div class="flex items-center justify-between border-y border-[#E5E5E5] py-3 mb-8 gap-3"><p id="count" class="text-sm"></p><label class="text-sm">Sort <select id="sort" class="border border-[#E5E5E5] p-2 bg-white"><option value="featured">Featured</option><option value="newest">Newest</option><option value="asc">Price: Low to High</option><option value="desc">Price: High to Low</option><option value="best">Best Selling</option></select></label></div><div id="grid" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-x-3 gap-y-8"></div
